# The lab's coordination server.
#
# This is Headscale, not Tailscale. Chapter 13 tells you to use a real throwaway
# tailnet for the hand-built VM rig, and that advice still stands there. This
# stack diverges on purpose, and lab/README.md explains why at length: the short
# version is that a lab you point an attacker at should not need an account, an
# internet connection, or anybody's production infrastructure.
#
# What that costs you: Headscale is a compatible reimplementation, so a
# behaviour you observe here is Headscale's behaviour. Chapter 01 describes
# Tailscale's. They agree on almost everything and you should not assume they
# agree on everything.

server_url: https://headscale:8443
listen_addr: 0.0.0.0:8443
metrics_listen_addr: 127.0.0.1:9090
grpc_listen_addr: 127.0.0.1:50443
grpc_allow_insecure: false

noise:
  private_key_path: /var/lib/headscale/noise_private.key

# 100.71.4.0/24 rather than the whole of the CGNAT range, so the addresses this
# lab hands out look like the ones the sandbox page shows.
prefixes:
  v4: 100.71.4.0/24
  v6: fd7a:115c:a1e0::/48
  allocation: sequential

derp:
  server:
    # The relay lives in this same process. A separate derper container would be
    # tidier on a diagram and would need its own trusted certificate, which
    # means shipping a CA for no gain: the relay path a client takes is
    # identical either way, and forcing that path is what the lab tests.
    enabled: true
    region_id: 999
    region_code: "lab"
    region_name: "The lab's own relay"
    stun_listen_addr: "0.0.0.0:3478"
    private_key_path: /var/lib/headscale/derp_server_private.key
    automatically_add_embedded_derp_region: true
    ipv4: 203.0.113.2
  # No public DERP map. Nothing in this lab reaches the internet for
  # coordination, which is what makes it repeatable and safe to break.
  urls: []
  paths: []
  auto_update_enabled: false
  update_frequency: 24h

disable_check_updates: true
ephemeral_node_inactivity_timeout: 30m

database:
  type: sqlite
  sqlite:
    path: /var/lib/headscale/db.sqlite

# DERP requires TLS. The certificate and its CA are generated by the control
# server on first boot, into a Docker volume — they never leave this machine and
# a `make reset` throws them away.
tls_cert_path: /lab/state/ca/headscale.crt
tls_key_path: /lab/state/ca/headscale.key

log:
  format: text
  level: info

# Stored in the database rather than read from a file, so the control server can
# swap the whole policy with `headscale policy set` and have it take effect on
# every node in seconds — no restart, which is also how the real thing behaves.
policy:
  mode: database

dns:
  magic_dns: false
  base_domain: lab.internal
  override_local_dns: false
  nameservers:
    global: []
  search_domains: []

unix_socket: /var/run/headscale/headscale.sock
unix_socket_permission: "0770"

logtail:
  enabled: false

randomize_client_port: false
